baseURL: https://thirty-before.github.io/
title: Thirty Before
theme: hugo-narrow
defaultContentLanguage: zh-hans
locale: zh-Hans
hasCJKLanguage: true
enableEmoji: true
mainSections:
  - posts
taxonomies:
  category: categories
  tag: tags
  series: series

pagination:
  pagerSize: 8

markup:
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false
  goldmark:
    renderer:
      unsafe: false
  highlight:
    codeFences: true
    guessSyntax: false
    lineNos: false
    noClasses: false
    style: github
    tabWidth: 2

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - WebAppManifest

outputFormats:
  WebAppManifest:
    mediaType: application/manifest+json
    baseName: site
    isPlainText: true

menus:
  main:
    - name: 首页
      pageRef: /
      weight: 10
      params:
        icon: home
    - name: 文章
      pageRef: /posts
      weight: 20
      params:
        icon: posts
    - name: 分类
      pageRef: /categories
      weight: 30
      params:
        icon: categories
    - name: 系列
      pageRef: /series
      weight: 40
      params:
        icon: bookmark
    - name: 项目
      pageRef: /projects
      weight: 50
      params:
        icon: projects
    - name: 更多
      weight: 60
      params:
        icon: layers
    - name: 归档
      pageRef: /archives
      parent: 更多
      weight: 1
      params:
        icon: archive
    - name: 标签
      pageRef: /tags
      parent: 更多
      weight: 2
      params:
        icon: tags
params:
  description: Thirty Before 组织主页，介绍组织方向、项目进展与协作方式。
  defaultAuthor: Thirty Before
  language: zh-CN
  shortName: Thirty Before
  images:
    - /images/thirty-before-mark.svg
  favicon:
    svg: /favicon.svg
  author:
    name: Thirty Before
    title: 组织主页
    description: 记录组织方向、项目进展与成员实践。
    avatar: /images/thirty-before-mark.svg
  header:
    sticky: true
    logo:
      image: /images/thirty-before-mark.svg
      link: /
    showThemeSwitch: true
    showDarkModeSwitch: true
    showLanguageSwitch: false
  dock: always
  immersiveMode:
    enabled: true
    default: false
    idleDelay: 2000
  contentWidth: 56rem
  toc:
    enabled: true
    position: center
  headingNumbering:
    enabled: true
    maxDepth: 4
    base: first-content-heading
    levelOneStyle: chinese
    levelOneSuffix: "、"
    decimalSeparator: "."
    space: " "
  colorScheme: default
  themes:
    default:
      name: Default
      order: 1
    claude:
      name: Claude
      order: 2
    bumblebee:
      name: Bumblebee
      order: 3
    emerald:
      name: Emerald
      order: 4
    nord:
      name: Nord
      order: 5
    sunset:
      name: Sunset
      order: 6
    abyss:
      name: Abyss
      order: 7
    dracula:
      name: Dracula
      order: 8
    amethyst:
      name: Amethyst
      order: 9
    slate:
      name: Slate
      order: 10
    twitter:
      name: Twitter
      order: 11
    minimal:
      name: Minimal
      order: 12
  home:
    contentOrder:
      - author-section
      - page-content
      - recent-posts
    recentPostsCount: 3
  post:
    showRelated: false
    license:
      show: false
  comments:
    enabled: false
  analytics:
    enabled: false
  katex:
    enabled: true
  mermaid:
    enabled: true
  gallery:
    enabled: true
    defaultLayout: justified
    gap: 10
    targetRowHeight: 200
    lastRowBehavior: center
    columnWidth: 200
    columns: 4
  lightbox:
    enabled: true
  codeblock:
    collapse:
      enabled: true
      defaultState: expanded
      autoCollapseLines: 8
      minCollapseLines: 6
      autoCollapseHeight: 400
      collapsedHeight: 120
  readingProgress:
    enabled: false
  dateFormat:
    full: :date_full
    long: 2006-01-02
    medium: 2006-01-02
    short: 01-02
  timeFormat:
    full: :time_full
    long: 15:04:05
    medium: 15:04
    short: 15:04

module:
  hugoVersion:
    extended: true
    min: 0.158.0
